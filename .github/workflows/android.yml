name: Build Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_BASE_URL: https://bc.bharatseo.site
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
            echo "Signing with release key"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret – APK is signed with a temporary debug key (updates will need uninstall)."
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/bc-report.apk"

      - name: Verify APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs bc-report.apk
          "$BT/aapt2" dump badging bc-report.apk | grep -E "^package|launchable"

      - uses: actions/upload-artifact@v4
        with:
          name: bc-report-apk
          path: bc-report.apk

      - name: Publish release (latest download link)
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v1.0.${{ github.run_number }}"
          gh release create "$TAG" bc-report.apk \
            --title "BC Report App 1.0.${{ github.run_number }}" \
            --notes "Android app for BCs. Install guide: https://bc.bharatseo.site/app-download.php" \
            --target "${{ github.sha }}" --latest
