# /etc/nginx/sites-available/bc-report   (ln -s to sites-enabled)
# BC Monitoring App, bc.bharatseo.site, on Ubuntu 24.04: nginx 1.24 + PHP 8.3-FPM, code in /var/www/bc-report.
# Also forwards LiveKit signalling for video meetings: wss://bc.bharatseo.site/rtc -> 127.0.0.1:7880.
# Full server setup: deploy/NEW-SERVER.md. For another domain, replace bc.bharatseo.site everywhere.

limit_req_zone $binary_remote_addr zone=bc_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bc_hook:10m rate=600r/m;

# WebSocket upgrade for LiveKit (/rtc)
map $http_upgrade $bc_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bc.bharatseo.site;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 (Ubuntu 24.04). On nginx >= 1.25 you may use "listen 443 ssl;" + "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bc.bharatseo.site;

    ssl_certificate     /etc/letsencrypt/live/bc.bharatseo.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bc.bharatseo.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bcssl:10m;
    ssl_session_timeout 1d;

    root /var/www/bc-report/public;
    index index.php index.html;   # index.html: the app pages under /app/
    client_max_body_size 12m;     # Excel import (8 MB), alarm audio (5 MB)
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # cdn.jsdelivr.net: Bootstrap, icons, LiveKit client. Google Fonts: meeting screen. wss: LiveKit signalling.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://bc.bharatseo.site; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    access_log /var/log/nginx/bc-report.access.log;
    error_log  /var/log/nginx/bc-report.error.log;

    # never serve dotfiles (.env lives outside public/ anyway)
    location ~ /\. { deny all; }

    # LiveKit (video meetings): WebSocket signalling + /rtc/validate. LiveKit itself listens on 127.0.0.1 only.
    location ^~ /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bc_conn_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /login.php {
        limit_req zone=bc_login burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /webhook.php {
        limit_req zone=bc_hook burst=100 nodelay;
        client_max_body_size 1m;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # uploaded / downloadable files are data, never code
    location ~* ^/(uploads|downloads)/.*\.(php|phtml|phar)$ { deny all; }

    # Android app download: the right type, so the phone offers "Install" (nginx's mime.types has no .apk)
    location ~* \.apk$ {
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300s;
    }

    location /assets/ { expires 7d; access_log off; }

    location / { try_files $uri $uri/ =404; }
}
