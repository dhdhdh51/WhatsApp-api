# /etc/nginx/sites-available/bc-report   (ln -s to sites-enabled)
# Replace reports.example.com and the PHP-FPM socket version (php8.3 on Ubuntu 24.04).
# Certificate: sudo certbot certonly --webroot -w /var/www/letsencrypt -d reports.example.com (see README)

limit_req_zone $binary_remote_addr zone=bc_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bc_hook:10m rate=600r/m;

server {
    listen 80;
    listen [::]:80;
    server_name reports.example.com;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 (Ubuntu 24.04). On nginx >= 1.25 you may use "listen 443 ssl;" + "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reports.example.com;

    ssl_certificate     /etc/letsencrypt/live/reports.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reports.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bcssl:10m;
    ssl_session_timeout 1d;

    root /var/www/bc-report/public;
    index index.php;
    client_max_body_size 6m;   # CSV import
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    access_log /var/log/nginx/bc-report.access.log;
    error_log  /var/log/nginx/bc-report.error.log;

    # never serve dotfiles (.env lives outside public/ anyway)
    location ~ /\. { deny all; }

    location = /login.php {
        limit_req zone=bc_login burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /webhook.php {
        limit_req zone=bc_hook burst=100 nodelay;
        client_max_body_size 1m;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    location /assets/ { expires 7d; access_log off; }

    location / { try_files $uri $uri/ =404; }
}
